name: Run Delay Analysis

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-analysis:
    runs-on: ubuntu-latest

    steps:
      - name:  Checkout code
        uses: actions/checkout@v3

      - name:  Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name:  Install Dependencies
        run: pip install pandas

      - name:  Run Python Script
        run: python delay_analysis.py
