name: Delay Summary Report

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install pandas numpy

    - name: Run Delay Analysis Script
      run: |
        cd "capstone project/Customer order insights and delivery tracker/week 5"
        python delay_analysis.py

    - name: Upload Delay Summary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: delay-summary
        path: capstone project/Customer order insights and delivery tracker/week 5/delay_summary.csv
