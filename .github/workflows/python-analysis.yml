name: Delay Analysis Workflow

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-delay-analysis:
    runs-on: ubuntu-latest

    steps:
      - name:  Checkout code
        uses: actions/checkout@v3

      - name:  Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name:  Install dependencies
        run: pip install pandas

      - name:  Run delay analysis
        run: python week5/delay_analysis.py
