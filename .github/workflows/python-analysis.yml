name: Delay Analysis Workflow

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-delay-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 Install dependencies
        run: pip install pandas

      - name: 🧮 Run delay analysis
        working-directory: data_engineering  # << this is your actual folder inside the repo
        run: python delay_analysis.py
