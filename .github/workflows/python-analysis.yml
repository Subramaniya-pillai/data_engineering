name: Delay Analysis CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v3

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.10

      - name: 📦 Install Dependencies
        run: |
          pip install pandas matplotlib

      - name: ▶️ Run Delay Analysis Script
        run: python delay_analysis.py

      - name: 📤 Upload Delay Summary Chart
        uses: actions/upload-artifact@v4
        with:
          name: delay-summary-graph
          path: delay_summary_chart.png
