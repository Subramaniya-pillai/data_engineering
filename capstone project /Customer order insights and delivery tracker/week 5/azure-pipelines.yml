trigger:
- main  # Or your active branch

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.x'

- script: |
    pip install pandas numpy
    python delay_analysis.py
  displayName: 'Run Python Delay Analysis'

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: 'delay_summary.csv'
    ArtifactName: 'DelayReport'
    publishLocation: 'Container'
